[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cdsswarm"
version = "0.1.5"
description = "Concurrent CDS API downloader with TUI and script mode"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Benedikt Giebl", email = "b.giebl@protonmail.com" }]
keywords = ["cds", "copernicus", "era5", "climate", "download", "concurrent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "cdsapi>=0.7",
    "requests",
    "tqdm",
    "textual>=0.87",
    "tomli>=1.1.0; python_version < '3.11'",
]

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pyyaml",
    "pre-commit",
]

[project.scripts]
cdsswarm = "cdsswarm.cli:main"

[project.urls]
Homepage = "https://github.com/bgiebl/cdsswarm"
Repository = "https://github.com/bgiebl/cdsswarm"
Issues = "https://github.com/bgiebl/cdsswarm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
