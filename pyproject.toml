[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cdsswarm"
version = "0.2.0"
description = "Concurrent CDS API downloader with TUI and script mode"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Benedikt Giebl", email = "b.giebl@protonmail.com" }]
keywords = ["cds", "copernicus", "era5", "climate", "download", "concurrent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "cdsapi>=0.7",
    "requests",
    "tqdm",
    "textual>=0.87",
    "tomli>=1.1.0; python_version < '3.11'",
    "shtab>=1.7",
]

[project.optional-dependencies]
yaml = ["pyyaml"]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pyyaml",
    "pre-commit",
    "ruff",
    "mypy",
    "types-requests",
    "types-tqdm",
    "types-PyYAML",
]
docs = ["zensical"]

[project.scripts]
cdsswarm = "cdsswarm.cli:main"

[project.urls]
Homepage = "https://github.com/bgiebl/cdsswarm"
Documentation = "https://cdsswarm.meteo-insight.eu/"
Repository = "https://github.com/bgiebl/cdsswarm"
Issues = "https://github.com/bgiebl/cdsswarm/issues"
Changelog = "https://github.com/bgiebl/cdsswarm/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
