name: Record TUI demo GIF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/cdsswarm/textual_app.py
      - examples/demo_textual.py
      - examples/demo.tape

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cdsswarm
        run: pip install -e .

      - name: Record GIF
        uses: charmbracelet/vhs-action@v2
        with:
          path: examples/demo.tape

      - name: Commit updated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/demo.gif
          git diff --staged --quiet || (git commit -m "Update TUI demo GIF" && git push)
