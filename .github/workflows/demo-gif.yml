name: Record TUI demo GIF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - src/cdsswarm/textual_app.py
      - examples/demo_textual.py
      - examples/demo.tape

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-go@v6
        with:
          go-version: "stable"

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg ttyd
          go install github.com/charmbracelet/vhs@latest
          pip install -e .

      - name: Record GIF
        run: vhs examples/demo.tape

      - name: Commit updated GIF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add img/demo.gif
          git diff --staged --quiet || (git commit -m "Update TUI demo GIF" && git push)
